<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>&#54;&#65039;&#8419;&#55;&#65039;&#8419;</title>
    <link rel="icon" href="https://kovu.dog/favicon.webp" />
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #050505;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        animation: cinematicFlicker 4s infinite alternate;
      }

      @keyframes cinematicFlicker {
        0% {
          opacity: 0.97;
        }
        100% {
          opacity: 1;
        }
      }

      #meme-gif {
        width: 100vmin;
        height: 100vmin;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        z-index: 1;
        /* Using transform here ensures GPU acceleration if the image moves */
        will-change: transform, filter;
        filter: contrast(1.05) brightness(0.95) saturate(0.85) sepia(0.15)
          hue-rotate(-5deg);
      }

      .vhs-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 10;
        box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.8);
      }

      /* --- OPTIMIZATION 1: The Grain Shift --- */
      .vhs-overlay::before {
        content: " ";
        display: block;
        position: absolute;
        /* Make the layer 200% size so we can shift it without exposing edges */
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background:
          url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"),
          linear-gradient(
            90deg,
            rgba(255, 0, 0, 0.03) 0%,
            rgba(0, 255, 0, 0.01) 50%,
            rgba(0, 0, 255, 0.03) 100%
          ),
          linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
        background-size:
          150px 150px,
          100% 100%,
          100% 4px;
        opacity: 0.6;
        z-index: 11;

        /* Tell the browser to prioritize this animation on the GPU */
        will-change: transform;
        animation: grainShift 0.08s infinite steps(2);
      }

      /* Use transform instead of background-position to stop page repaints */
      @keyframes grainShift {
        0% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(25px, 25px);
        }
        100% {
          transform: translate(-25px, -25px);
        }
      }

      /* --- OPTIMIZATION 2: The Tracking Band --- */
      .vhs-overlay::after {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 25vh;

        /* Replaced expensive backdrop-filter with a cheap gradient wash */
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.04) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        z-index: 12;

        will-change: transform;
        animation: slowRoll 12s linear infinite;
      }

      @keyframes slowRoll {
        0% {
          transform: translateY(-30vh);
        }
        100% {
          transform: translateY(130vh);
        }
      }

      #chaos-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 15;
        overflow: hidden;
      }

      .tape-spot {
        position: absolute;
        top: 0;
        left: 0; /* Base position for our hardware-accelerated translation */
        background-color: #000;
        opacity: 0.8;
        border-radius: 40%;
        will-change: transform, opacity;
      }

      #interaction-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 9999;
        background: transparent;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="interaction-overlay"></div>

    <audio id="meme-audio" playsinline></audio>

    <div id="chaos-container"></div>
    <div class="vhs-overlay"></div>

    <img id="meme-gif" src="6-7.gif" alt="Meme" />

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const memeAudio = document.getElementById("meme-audio");
        const chaosContainer = document.getElementById("chaos-container");
        const interactionOverlay = document.getElementById(
          "interaction-overlay",
        );

        let audioCtx;
        let isAudioInitialized = false;

        function initAudioEffects() {
          if (isAudioInitialized) return;

          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();

          const source = audioCtx.createMediaElementSource(memeAudio);

          const lowpass = audioCtx.createBiquadFilter();
          lowpass.type = "lowpass";
          lowpass.frequency.value = 3500;

          const highpass = audioCtx.createBiquadFilter();
          highpass.type = "highpass";
          highpass.frequency.value = 350;

          const distortion = audioCtx.createWaveShaper();
          function makeDistortionCurve(amount) {
            let k = typeof amount === "number" ? amount : 50,
              n_samples = 44100,
              curve = new Float32Array(n_samples),
              deg = Math.PI / 180,
              i = 0,
              x;
            for (; i < n_samples; ++i) {
              x = (i * 2) / n_samples - 1;
              curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
            }
            return curve;
          }
          distortion.curve = makeDistortionCurve(5);

          const masterGain = audioCtx.createGain();
          masterGain.gain.value = 0.8;

          source.connect(highpass);
          highpass.connect(lowpass);
          lowpass.connect(distortion);
          distortion.connect(masterGain);
          masterGain.connect(audioCtx.destination);

          const bufferSize = audioCtx.sampleRate * 2;
          const noiseBuffer = audioCtx.createBuffer(
            1,
            bufferSize,
            audioCtx.sampleRate,
          );
          const output = noiseBuffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            output[i] = Math.random() * 2 - 1;
          }
          const noise = audioCtx.createBufferSource();
          noise.buffer = noiseBuffer;
          noise.loop = true;

          const noiseFilter = audioCtx.createBiquadFilter();
          noiseFilter.type = "lowpass";
          noiseFilter.frequency.value = 4000;

          const noiseGain = audioCtx.createGain();
          noiseGain.gain.value = 0.02;

          noise.connect(noiseFilter);
          noiseFilter.connect(noiseGain);
          noiseGain.connect(audioCtx.destination);
          noise.start();

          isAudioInitialized = true;
        }

        initAudioEffects();

        function playTapePop() {
          if (!audioCtx || audioCtx.state === "suspended") return;
          const popOsc = audioCtx.createOscillator();
          const popGain = audioCtx.createGain();

          popOsc.type = "sine";
          popOsc.frequency.setValueAtTime(100, audioCtx.currentTime);
          popOsc.frequency.exponentialRampToValueAtTime(
            10,
            audioCtx.currentTime + 0.05,
          );

          popGain.gain.setValueAtTime(0.5, audioCtx.currentTime);
          popGain.gain.exponentialRampToValueAtTime(
            0.01,
            audioCtx.currentTime + 0.05,
          );

          popOsc.connect(popGain);
          popGain.connect(audioCtx.destination);

          popOsc.start();
          popOsc.stop(audioCtx.currentTime + 0.05);
        }

        // --- OPTIMIZATION 3: Object Pooling for the Chaos Engine ---

        // Pre-create 5 invisible elements so we never have to touch the DOM again
        const spotPool = [];
        for (let i = 0; i < 5; i++) {
          const spot = document.createElement("div");
          spot.classList.add("tape-spot");
          spot.style.display = "none";
          chaosContainer.appendChild(spot);
          spotPool.push({ el: spot, active: false });
        }

        function spawnArtifact() {
          if (Math.random() < 0.25) {
            // Slightly lowered chance to reduce load

            // Find an inactive spot in our pool
            const availableSpot = spotPool.find((s) => !s.active);
            if (!availableSpot) return; // If all 5 are on screen, skip this frame

            availableSpot.active = true;
            const spot = availableSpot.el;

            const isLargeDropout = Math.random() < 0.05;
            const width = isLargeDropout
              ? Math.random() * 100 + 50
              : Math.random() * 15 + 2;
            const height = isLargeDropout
              ? Math.random() * 15 + 2
              : Math.random() * 10 + 2;

            spot.style.width = `${width}px`;
            spot.style.height = `${height}px`;

            // Use transform translate instead of left/top for performance
            spot.style.transform = `translate(${Math.random() * 100}vw, ${Math.random() * 100}vh)`;

            if (Math.random() < 0.15) {
              spot.style.backgroundColor = "rgba(255, 255, 255, 0.7)";
            } else {
              spot.style.backgroundColor = `rgba(0, 0, 0, ${Math.random() * 0.5 + 0.4})`;
            }

            spot.style.display = "block";

            if (isLargeDropout) {
              playTapePop();
            }

            setTimeout(
              () => {
                spot.style.display = "none";
                availableSpot.active = false;
              },
              Math.random() * 120 + 30,
            );
          }
        }

        // Increased interval from 50ms to 80ms (Approx 12 FPS check, plenty for chaotic glitches)
        setInterval(spawnArtifact, 80);

        // --- 3. THE AUDIO PLAYLIST ---
        const playlist = ["1.mp3", "2.mp3", "3.mp3", "4.mp3", "5.mp3"];

        for (let i = playlist.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [playlist[i], playlist[j]] = [playlist[j], playlist[i]];
        }

        let currentTrack = 0;
        memeAudio.src = playlist[currentTrack];

        memeAudio.addEventListener("ended", () => {
          currentTrack++;
          if (currentTrack >= playlist.length) {
            currentTrack = 0;
          }
          memeAudio.src = playlist[currentTrack];
          memeAudio
            .play()
            .catch((e) => console.error("Playlist playback failed:", e));
        });

        // --- 4. AUTOPLAY ATTEMPT & INTERACTION FALLBACK ---
        memeAudio
          .play()
          .then(() => {
            if (audioCtx.state === "running") {
              console.log("Full VHS autoplay successful!");
              interactionOverlay.remove();
            } else {
              console.log(
                "Audio playing silently. Waiting for tap to resume VHS filters.",
              );
            }
          })
          .catch((e) =>
            console.log("Autoplay entirely blocked. Waiting for tap."),
          );

        const forceAudioPlay = () => {
          if (audioCtx && audioCtx.state === "suspended") {
            audioCtx.resume();
          }
          memeAudio.play().catch((e) => console.error("Still blocked:", e));

          if (document.body.contains(interactionOverlay)) {
            interactionOverlay.remove();
          }
          document.removeEventListener("keydown", forceAudioPlay);
        };

        interactionOverlay.addEventListener("click", forceAudioPlay);
        interactionOverlay.addEventListener("touchend", forceAudioPlay);
        document.addEventListener("keydown", forceAudioPlay);

        // --- 5. THE EASTER EGG (KEYLOGGER) ---
        let keyBuffer = "";
        const secretCode = "BALLS";

        document.addEventListener("keydown", (e) => {
          if (e.key.length === 1) {
            keyBuffer += e.key.toUpperCase();
            if (keyBuffer.length > secretCode.length) {
              keyBuffer = keyBuffer.slice(-secretCode.length);
            }
            if (keyBuffer === secretCode) {
              document.getElementById("meme-gif").src = "balls.gif";
            }
          }
        });
      });
    </script>
  </body>
</html>
