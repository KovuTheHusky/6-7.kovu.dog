<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>&#54;&#65039;&#8419;&#55;&#65039;&#8419;</title>
    <link rel="icon" href="https://kovu.dog/favicon.webp" />
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #020202;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        animation: cinematicFlicker 3s infinite alternate;
      }

      @keyframes cinematicFlicker {
        0%,
        90% {
          opacity: 0.95;
        }
        95% {
          opacity: 0.8;
        }
        100% {
          opacity: 1;
        }
      }

      #meme-gif {
        width: 100vmin;
        height: 100vmin;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        z-index: 1;
        border-radius: 3%;

        filter: contrast(1.4) brightness(0.85) saturate(0.5) sepia(0.5)
          hue-rotate(-15deg);

        will-change: transform, filter;
        animation: tapeJitter 4s infinite;
      }

      @keyframes tapeJitter {
        0%,
        93% {
          transform: translate(0, 0) scale(1);
        }
        94% {
          transform: translate(4px, -2px) scale(1.01);
        }
        95% {
          transform: translate(-5px, 3px) scale(1.01);
        }
        96% {
          transform: translate(3px, -4px) scale(1.01);
        }
        97% {
          transform: translate(-2px, 1px) scale(1.01);
        }
        98%,
        100% {
          transform: translate(0, 0) scale(1);
        }
      }

      .vhs-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 10;
        box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.95);
      }

      .vhs-overlay::before {
        content: " ";
        display: block;
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background:
          url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"),
          linear-gradient(
            90deg,
            rgba(255, 0, 0, 0.05) 0%,
            rgba(0, 255, 0, 0.02) 50%,
            rgba(0, 0, 255, 0.05) 100%
          ),
          linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
        background-size:
          150px 150px,
          100% 100%,
          100% 6px;
        opacity: 0.7;
        z-index: 11;

        will-change: transform;
        animation: grainShift 0.08s infinite steps(2);
      }

      @keyframes grainShift {
        0% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(25px, 25px);
        }
        100% {
          transform: translate(-25px, -25px);
        }
      }

      .vhs-overlay::after {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 12vh;

        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.15) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        mix-blend-mode: overlay;
        z-index: 12;

        will-change: transform;
        animation: slowRoll 8s linear infinite;
      }

      @keyframes slowRoll {
        0% {
          transform: translateY(-30vh);
        }
        100% {
          transform: translateY(130vh);
        }
      }

      #chaos-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 15;
        overflow: hidden;
      }

      .tape-spot {
        position: absolute;
        top: 0;
        left: 0;
        background-color: #fff;
        will-change: transform, opacity;
      }

      #interaction-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 9999;
        background: transparent;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="interaction-overlay"></div>

    <audio id="meme-audio" playsinline></audio>

    <div id="chaos-container"></div>
    <div class="vhs-overlay"></div>

    <img id="meme-gif" src="6-7.gif" alt="Meme" />

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const memeAudio = document.getElementById("meme-audio");
        const chaosContainer = document.getElementById("chaos-container");
        const interactionOverlay = document.getElementById(
          "interaction-overlay",
        );

        let audioCtx;
        let isAudioInitialized = false;

        function initAudioEffects() {
          if (isAudioInitialized) return;

          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();

          const source = audioCtx.createMediaElementSource(memeAudio);

          const lowpass = audioCtx.createBiquadFilter();
          lowpass.type = "lowpass";
          lowpass.frequency.value = 2500;

          const highpass = audioCtx.createBiquadFilter();
          highpass.type = "highpass";
          highpass.frequency.value = 350;

          const distortion = audioCtx.createWaveShaper();
          function makeDistortionCurve(amount) {
            let k = typeof amount === "number" ? amount : 50,
              n_samples = 44100,
              curve = new Float32Array(n_samples),
              deg = Math.PI / 180,
              i = 0,
              x;
            for (; i < n_samples; ++i) {
              x = (i * 2) / n_samples - 1;
              curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
            }
            return curve;
          }
          distortion.curve = makeDistortionCurve(25);

          // --- THE WOW & FLUTTER ENGINE ---
          const delay = audioCtx.createDelay();
          delay.delayTime.value = 0.05; // Base delay buffer

          // "Wow" (Slow tape stretching pitch bend)
          const wowLfo = audioCtx.createOscillator();
          wowLfo.type = "sine";
          wowLfo.frequency.value = 0.5; // 0.5 Hz is a slow, seasick wobble

          const wowGain = audioCtx.createGain();
          wowGain.gain.value = 0.001; // Depth of the pitch bend

          // "Flutter" (Fast, rattling tape capstan vibration)
          const flutterLfo = audioCtx.createOscillator();
          flutterLfo.type = "sine";
          flutterLfo.frequency.value = 8; // 8 Hz fast rattle

          const flutterGain = audioCtx.createGain();
          flutterGain.gain.value = 0.0001; // Very subtle depth

          wowLfo.connect(wowGain);
          wowGain.connect(delay.delayTime);
          wowLfo.start();

          flutterLfo.connect(flutterGain);
          flutterGain.connect(delay.delayTime);
          flutterLfo.start();
          // --------------------------------

          const masterGain = audioCtx.createGain();
          masterGain.gain.value = 0.8;

          // Wire it up: Source -> Highpass -> Lowpass -> Distortion -> Wow/Flutter Delay -> Master
          source.connect(highpass);
          highpass.connect(lowpass);
          lowpass.connect(distortion);
          distortion.connect(delay);
          delay.connect(masterGain);
          masterGain.connect(audioCtx.destination);

          const bufferSize = audioCtx.sampleRate * 2;
          const noiseBuffer = audioCtx.createBuffer(
            1,
            bufferSize,
            audioCtx.sampleRate,
          );
          const output = noiseBuffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            output[i] = Math.random() * 2 - 1;
          }
          const noise = audioCtx.createBufferSource();
          noise.buffer = noiseBuffer;
          noise.loop = true;

          const noiseFilter = audioCtx.createBiquadFilter();
          noiseFilter.type = "lowpass";
          noiseFilter.frequency.value = 4000;

          const noiseGain = audioCtx.createGain();
          noiseGain.gain.value = 0.025;

          noise.connect(noiseFilter);
          noiseFilter.connect(noiseGain);
          noiseGain.connect(audioCtx.destination);
          noise.start();

          isAudioInitialized = true;
        }

        initAudioEffects();

        function playTapePop() {
          if (!audioCtx || audioCtx.state === "suspended") return;
          const popOsc = audioCtx.createOscillator();
          const popGain = audioCtx.createGain();

          popOsc.type = "square";
          popOsc.frequency.setValueAtTime(80, audioCtx.currentTime);
          popOsc.frequency.exponentialRampToValueAtTime(
            5,
            audioCtx.currentTime + 0.05,
          );

          popGain.gain.setValueAtTime(0.6, audioCtx.currentTime);
          popGain.gain.exponentialRampToValueAtTime(
            0.01,
            audioCtx.currentTime + 0.05,
          );

          popOsc.connect(popGain);
          popGain.connect(audioCtx.destination);

          popOsc.start();
          popOsc.stop(audioCtx.currentTime + 0.05);
        }

        const spotPool = [];
        for (let i = 0; i < 5; i++) {
          const spot = document.createElement("div");
          spot.classList.add("tape-spot");
          spot.style.display = "none";
          chaosContainer.appendChild(spot);
          spotPool.push({ el: spot, active: false });
        }

        function spawnArtifact() {
          if (Math.random() < 0.25) {
            const availableSpot = spotPool.find((s) => !s.active);
            if (!availableSpot) return;

            availableSpot.active = true;
            const spot = availableSpot.el;

            const isLargeDropout = Math.random() < 0.05;
            const width = isLargeDropout
              ? Math.random() * 80 + 20 + "vw"
              : Math.random() * 30 + 5 + "vw";
            const height = isLargeDropout
              ? Math.random() * 6 + 2 + "px"
              : Math.random() * 3 + 1 + "px";

            spot.style.width = width;
            spot.style.height = height;

            spot.style.transform = `translate(${Math.random() * 100}vw, ${Math.random() * 100}vh)`;

            if (Math.random() < 0.7) {
              spot.style.backgroundColor = `rgba(255, 255, 255, ${Math.random() * 0.4 + 0.2})`;
            } else {
              spot.style.backgroundColor = `rgba(0, 0, 0, ${Math.random() * 0.5 + 0.3})`;
            }

            spot.style.display = "block";

            if (isLargeDropout) {
              playTapePop();
            }

            setTimeout(
              () => {
                spot.style.display = "none";
                availableSpot.active = false;
              },
              Math.random() * 80 + 20,
            );
          }
        }

        setInterval(spawnArtifact, 80);

        const playlist = ["1.mp3", "2.mp3", "3.mp3", "4.mp3", "5.mp3"];

        for (let i = playlist.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [playlist[i], playlist[j]] = [playlist[j], playlist[i]];
        }

        let currentTrack = 0;
        memeAudio.src = playlist[currentTrack];

        memeAudio.addEventListener("ended", () => {
          currentTrack++;
          if (currentTrack >= playlist.length) {
            currentTrack = 0;
          }
          memeAudio.src = playlist[currentTrack];
          memeAudio
            .play()
            .catch((e) => console.error("Playlist playback failed:", e));
        });

        memeAudio
          .play()
          .then(() => {
            if (audioCtx.state === "running") {
              console.log("Full VHS autoplay successful!");
              interactionOverlay.remove();
            } else {
              console.log(
                "Audio playing silently. Waiting for tap to resume VHS filters.",
              );
            }
          })
          .catch((e) =>
            console.log("Autoplay entirely blocked. Waiting for tap."),
          );

        const forceAudioPlay = () => {
          if (audioCtx && audioCtx.state === "suspended") {
            audioCtx.resume();
          }
          memeAudio.play().catch((e) => console.error("Still blocked:", e));

          if (document.body.contains(interactionOverlay)) {
            interactionOverlay.remove();
          }
          document.removeEventListener("keydown", forceAudioPlay);
        };

        interactionOverlay.addEventListener("click", forceAudioPlay);
        interactionOverlay.addEventListener("touchend", forceAudioPlay);
        document.addEventListener("keydown", forceAudioPlay);

        let keyBuffer = "";
        const secretCode = "BALLS";

        document.addEventListener("keydown", (e) => {
          if (e.key.length === 1) {
            keyBuffer += e.key.toUpperCase();
            if (keyBuffer.length > secretCode.length) {
              keyBuffer = keyBuffer.slice(-secretCode.length);
            }
            if (keyBuffer === secretCode) {
              document.getElementById("meme-gif").src = "balls.gif";
            }
          }
        });
      });
    </script>
  </body>
</html>
